
[project]
name = "multi-source-advanced-rag-assistant"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "langchain",
    "langchain-text-splitters",
    "qdrant-client",
    "sentence-transformers",
    "torch==2.14.1",
    "huggingface-hub",
    "rank-bm25",
    "openai",
    "python-dotenv",
    "pypdf",
    "python-docx",
    "python-multipart",
    "beautifulsoup4",
    "httpx",
    "aiohttp",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.fastapi]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python scripts/download_models.py"
